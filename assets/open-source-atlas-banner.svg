<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">The Open Source Atlas</title>
  <desc id="desc">A colorful star field and geometric globe behind the words The Open Source Atlas</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#100b2e"/><stop offset=".52" stop-color="#31227d"/><stop offset="1" stop-color="#00a990"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ffcf5a" stop-opacity=".9"/><stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/></radialGradient>
    <linearGradient id="globe" x1="0" x2="1"><stop stop-color="#52e0ff"/><stop offset="1" stop-color="#d9a5ff"/></linearGradient>
  </defs>
  <rect width="1600" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1240" cy="215" r="300" fill="url(#glow)" opacity=".42"/>
  <g fill="#fff" opacity=".8"><circle cx="112" cy="105" r="4"/><circle cx="270" cy="392" r="3"/><circle cx="490" cy="88" r="5"/><circle cx="710" cy="426" r="4"/><circle cx="1050" cy="86" r="4"/><circle cx="1460" cy="104" r="4"/><circle cx="1510" cy="410" r="3"/></g>
  <g transform="translate(1225 260)" fill="none" stroke="url(#globe)" stroke-width="7" opacity=".92"><circle r="146"/><ellipse rx="64" ry="146"/><path d="M-146 0h292M-126-74h252M-126 74h252"/><path d="M-104-104Q0-25 104-104M-104 104Q0 25 104 104"/></g>
  <text x="120" y="196" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#79f5d5" font-weight="700" letter-spacing="7">CURATED • OPEN • ENDURING</text>
  <text x="114" y="291" font-family="Arial, Helvetica, sans-serif" font-size="78" fill="#fff" font-weight="800">THE OPEN SOURCE</text>
  <text x="114" y="383" font-family="Arial, Helvetica, sans-serif" font-size="90" fill="#ffcf5a" font-weight="800">ATLAS</text>
  <text x="118" y="439" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#d8d5ff">Remarkable software, shared with the world.</text>
</svg>
